<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATH | Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#e31b23;--red-dark:#c9161d;--navy:#071321;--navy-light:#10283e;--text:#17202b;--muted:#788391;--border:#e3e7ec;--bg:#f4f6f8;--white:#fff;--green:#0f9d58;--amber:#d98b06;--blue:#1d6fb8}
body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{text-decoration:none;color:inherit}
button,input,select{font-family:inherit}

/* ===== HEADER ===== */
.top{position:sticky;top:0;z-index:50;height:68px;display:flex;align-items:center;gap:18px;padding:0 28px;color:#fff;
  background:radial-gradient(circle at 12% 0,rgba(227,27,35,.28),transparent 32%),linear-gradient(135deg,#06111d 0%,#0a1b2c 55%,#163b5b 100%)}
.burger{display:none;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.top .logo{height:40px;width:auto;display:block}
.top .logo-text{display:none;font-weight:800;font-size:18px}
.search{flex:1;max-width:420px;margin-left:24px;position:relative}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8798a9;font-size:13px}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;padding:0 14px 0 38px;font-size:13px;outline:none;transition:.2s}
.search input::placeholder{color:#8798a9}
.search input:focus{background:rgba(255,255,255,.12);border-color:var(--red)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.campus{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;padding:0 12px;font-size:13px;font-weight:600;outline:none;cursor:pointer}
.campus option{color:#17202b}
.icon-btn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #0a1b2c}
.user{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid rgba(255,255,255,.14)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),#8f0f15);display:grid;place-items:center;font-weight:700;font-size:13px}
.user b{display:block;font-size:13px}.user small{color:#8798a9;font-size:11px}

/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 68px)}
.side{position:sticky;top:68px;height:calc(100vh - 68px);padding:24px 16px 18px;display:flex;flex-direction:column;overflow-y:auto;color:#c9d3df;
 background:radial-gradient(circle at 0 0,rgba(227,27,35,.18),transparent 40%),linear-gradient(180deg,#0a1b2c 0%,#071321 100%);border-right:1px solid rgba(255,255,255,.05)}
.side h6{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#5f7286;margin:20px 12px 9px;font-weight:700}
.side h6:first-child{margin-top:0}
.nav a{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:12px;color:#aab8c7;font-weight:600;font-size:13px;margin-bottom:3px;transition:.2s;position:relative}
.nav a i{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:#8ea1b6;font-size:14px;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a:hover i{background:rgba(255,255,255,.1);color:#fff}
.nav a.on{color:#fff;background:linear-gradient(90deg,rgba(227,27,35,.3),rgba(227,27,35,.04));box-shadow:inset 0 0 0 1px rgba(227,27,35,.3)}
.nav a.on i{background:linear-gradient(135deg,var(--red),#8f0f15);color:#fff;box-shadow:0 6px 16px rgba(227,27,35,.45)}
.nav a.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--red)}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.help{margin-top:auto;padding:16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:12px;line-height:1.6;color:#9fb0c1}
.help b{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.help a{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:#fff;font-weight:600}
.help a i{color:var(--red)}
.side-foot{margin-top:14px;text-align:center;color:#5f7286;font-size:10px;line-height:1.6}
.main{padding:30px 34px 50px;min-width:0}

/* ===== COMMON ===== */
.eyebrow{color:var(--red);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-h h1{font-size:28px;letter-spacing:-1px}.page-h p{color:var(--muted);margin-top:4px}
.btn{height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 10px 25px rgba(227,27,35,.18);transition:.25s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--red-dark);transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px}
.card h3{font-size:15px;letter-spacing:-.3px;margin-bottom:4px}.card .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:20px}
.chip{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.c-green{background:#e7f6ee;color:var(--green)}.c-amber{background:#fff4dd;color:var(--amber)}.c-blue{background:#e6f1fb;color:var(--blue)}.c-grey{background:#eef1f4;color:#687482}.c-red{background:#fdebec;color:var(--red)}

/* ===== HERO + KPI ===== */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:34px 38px;color:#fff;margin-bottom:22px;
  background:radial-gradient(circle at 15% 10%,rgba(227,27,35,.3),transparent 32%),linear-gradient(135deg,#06111d 0%,#0a1b2c 55%,#163b5b 100%)}
.hero::after{content:"\f072";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;right:40px;top:-10px;font-size:190px;color:rgba(255,255,255,.05);transform:rotate(-35deg)}
.hero::before{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(255,255,255,.07);border-radius:50%;right:-120px;bottom:-240px}
.hero h1{font-size:34px;letter-spacing:-2px;line-height:1.1;margin-bottom:8px;position:relative}
.hero h1 span{color:var(--red)}
.hero p{color:#b8c4d0;max-width:520px;line-height:1.7;position:relative}
.hero .acts{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:17px;margin-bottom:16px}
.kpi b{display:block;font-size:28px;letter-spacing:-1.5px}.kpi span{color:var(--muted);font-size:12px;font-weight:500}
.kpi em{position:absolute;right:18px;top:20px;font-style:normal;font-size:11px;font-weight:700}
.up{color:var(--green)}.down{color:var(--red)}

/* ===== CHARTS ===== */
.bars{display:flex;align-items:flex-end;gap:16px;height:190px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar i{width:100%;max-width:46px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--red),#8f0f15);position:relative;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bar:nth-child(odd) i{background:linear-gradient(180deg,#1c4b73,var(--navy-light))}
.bar i::before{content:attr(data-v);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--text)}
.bar small{color:var(--muted);font-size:11px;font-weight:600}
.donut{display:flex;align-items:center;gap:24px}
.ring{width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--red) 0 58%,#163b5b 58% 100%)}
.ring div{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;letter-spacing:-1px}
.ring small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0}
.legend p{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px;font-weight:600}
.legend p:last-child{margin:0}.legend s{width:10px;height:10px;border-radius:3px;background:var(--red)}
.legend p+p s{background:#163b5b}.legend span{color:var(--muted);font-weight:500;margin-left:auto}

/* ===== MODULE TILES ===== */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:30px 0 16px}
.sec-h h2{font-size:19px;letter-spacing:-.7px}.sec-h p{color:var(--muted);font-size:12px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.mod{position:relative;background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;transition:.25s;display:block;overflow:hidden}
.mod::after{content:"\f061";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;right:20px;bottom:20px;font-size:12px;color:var(--red);opacity:0;transform:translateX(-8px);transition:.25s}
.mod:hover{transform:translateY(-4px);border-color:rgba(227,27,35,.4);box-shadow:0 18px 38px rgba(7,19,33,.09)}
.mod:hover::after{opacity:1;transform:none}
.mod .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:19px;color:#fff;margin-bottom:18px;background:linear-gradient(135deg,var(--navy-light),var(--navy))}
.mod:nth-child(3n+1) .mi{background:linear-gradient(135deg,var(--red),#8f0f15)}
.mod h4{font-size:15px;letter-spacing:-.4px;margin-bottom:6px}.mod p{color:var(--muted);font-size:12px;line-height:1.6;padding-right:14px}
.mod .badge{position:absolute;top:20px;right:20px}

/* ===== TABLES ===== */
.tools{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tools .f{position:relative;flex:1;min-width:220px}
.tools .f i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#98a3af;font-size:13px}
.inp,.sel{height:44px;border:1px solid var(--border);border-radius:10px;background:#fafbfc;font-size:13px;outline:none;transition:.25s;color:var(--text)}
.inp{width:100%;padding:0 14px 0 38px}.sel{padding:0 12px;font-weight:600}
.inp:focus,.sel:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px rgba(227,27,35,.07)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a0a9b3;padding:0 14px 12px;font-weight:700}
td{padding:14px;border-top:1px solid #edf0f3;font-size:13px;vertical-align:middle}
tbody tr{transition:.15s;cursor:pointer}tbody tr:hover{background:#fafbfc}
.who{display:flex;align-items:center;gap:12px;font-weight:600}
.who .avatar{width:36px;height:36px;font-size:12px;color:#fff}
.who small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ===== FEE REFERENCE ===== */
.fee{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #edf0f3;font-size:12.5px}
.fee:first-of-type{border:0}.fee b{letter-spacing:-.3px}
.fee-h{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:700;margin:16px 0 4px}
.fee-h:first-of-type{margin-top:0}

/* ===== MODULE PAGES ===== */
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.feat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px}
.feat i{color:var(--red);font-size:16px;margin-bottom:14px;display:block}.feat h4{margin-bottom:6px;font-size:14px}.feat p{color:var(--muted);font-size:12px;line-height:1.6}
.note{margin-top:22px;padding:16px 20px;border-radius:12px;background:#fff;border:1px dashed #cfd6de;color:var(--muted);font-size:12.5px;display:flex;gap:12px;align-items:center}
.note i{color:var(--red)}

/* ===== REGISTRATION FORM ===== */
.crumb{color:var(--muted);font-size:12px;margin-bottom:10px}.crumb a{color:var(--red);font-weight:600}
.idp{display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 16px;font-size:12px;color:var(--muted)}
.idp i{color:var(--red)}.idp b{color:var(--text);font-size:14px;letter-spacing:.4px}
.stepper{display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:20px;overflow-x:auto}
.stp{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:11px;font-weight:600;color:#a0a9b3;text-align:center}
.stp i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:#eef1f4;color:#788391;position:relative;z-index:1;transition:.25s}
.stp::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);right:calc(-50% + 24px);height:2px;background:#e3e7ec}
.stp:last-child::after{display:none}
.stp.dn::after{background:var(--red)}
.stp.dn i{background:var(--red);color:#fff;font-size:0}
.stp.dn i::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;font-size:13px}
.stp.on i{background:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(227,27,35,.25)}
.stp.on,.stp.dn{color:var(--text)}
.formcard{background:#fff;border:1px solid var(--border);border-radius:20px;padding:34px 38px}
.st{display:none}.st.on{display:block;animation:sin .35s}
@keyframes sin{from{opacity:0;transform:translateY(8px)}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid #edf0f3}
.sh h3{font-size:21px;letter-spacing:-.8px}.sh p{color:var(--muted);font-size:13px;margin-top:4px}
.sub-h{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin:32px 0 16px;display:flex;align-items:center;gap:12px}
.sub-h::after{content:"";flex:1;height:1px;background:#edf0f3}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:8px}.fld label b{color:var(--red)}
.fld .inp,.fld .sel{width:100%;height:50px;padding:0 14px}
.fld textarea.inp{height:auto;padding:12px 14px;resize:vertical;font-family:inherit}
.fld input[readonly]{background:#f0f3f6;font-weight:700}
.fld small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
.fld.bad .inp,.fld.bad .sel{border-color:var(--red);background:#fff8f8}
.fld.bad::after{content:"This field is required";color:var(--red);font-size:11px;display:block;margin-top:5px}
.fld label.chk,.chk{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:#4b5766;cursor:pointer;margin:0}
.chk input{accent-color:var(--red);width:17px;height:17px}
.full{grid-column:1/-1}.hid{display:none!important}
.pers{display:grid;grid-template-columns:150px 1fr;gap:30px;align-items:start}
.photo{width:150px;height:180px;border-radius:16px;border:2px dashed #cfd6de;background:#fafbfc center/cover;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;text-align:center;transition:.2s}
.photo:hover{border-color:var(--red);color:var(--red)}.photo i{display:block;font-size:26px;margin-bottom:8px}
.elig{display:flex;gap:14px;align-items:flex-start;margin-top:26px;padding:16px 18px;border-radius:14px;font-size:13px;line-height:1.6;border:1px solid}
.elig i{font-size:20px;margin-top:2px}.elig b{display:block;font-size:14px}
.elig.ok{background:#e7f6ee;border-color:#bfe6d0;color:#0b6b3c}.elig.am{background:#fff4dd;border-color:#f3dba4;color:#8a5a00}.elig.no{background:#fdebec;border-color:#f6c2c5;color:#a5121a}
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.up{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:20px;border:1.5px dashed #cfd6de;border-radius:14px;background:#fafbfc;cursor:pointer;transition:.2s;font-size:12px;color:var(--muted);word-break:break-all}
.up:hover{border-color:var(--red);background:#fff}.up i{font-size:20px;color:var(--red);margin-bottom:6px}.up b{color:var(--text);font-size:13px}
.up.done{border-style:solid;border-color:#bfe6d0;background:#f3fbf7}.up.done i{color:var(--green)}
.feeg{display:grid;grid-template-columns:1fr 340px;gap:30px}
.vch{border-radius:18px;padding:24px;color:#fff;position:relative;overflow:hidden;align-self:start;background:radial-gradient(circle at 15% 10%,rgba(227,27,35,.3),transparent 40%),linear-gradient(135deg,#06111d,#0a1b2c 55%,#163b5b)}
.vt{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:22px}.vt i{color:var(--red)}
.vch small{color:#8798a9;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.vch>b{display:block;font-size:22px;letter-spacing:-.5px;margin:4px 0 18px}
.vr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px}.vr span{color:#8798a9}.vr em{font-style:normal;font-weight:600;text-align:right}
.vamt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.3)}.vamt b{font-size:22px}
.vch p{color:#8798a9;font-size:10px;margin-top:14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:24px}
.sum div{padding:14px 16px;background:#fafbfc;border:1px solid var(--border);border-radius:12px}.sum span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.sum b{font-size:13px}
.fnav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:24px;border-top:1px solid #edf0f3;gap:12px;flex-wrap:wrap}.fnav>div{display:flex;gap:12px}
#stx{color:var(--muted);font-size:12px;font-weight:600}
.btn.light{background:#fff;color:var(--text);border:1px solid var(--border);box-shadow:none}.btn.light:hover{background:#f4f6f8}
.ok-card{text-align:center;padding:60px 20px}
.okc{width:76px;height:76px;border-radius:50%;background:#e7f6ee;color:var(--green);display:grid;place-items:center;font-size:30px;margin:0 auto 20px}
.ok-card h2{font-size:26px;letter-spacing:-1px;margin-bottom:6px}.ok-card p{color:var(--muted)}
.idbox{display:inline-block;margin:24px 0;padding:16px 36px;border-radius:14px;background:var(--navy);color:#fff}
.idbox span{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8798a9}.idbox b{font-size:28px;letter-spacing:-1px}
.ok-card .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@media(max-width:700px){.pers,.feeg,.fg,.fg.c3,.docs{grid-template-columns:1fr}.formcard{padding:24px 18px}.stp span{display:none}.stp{min-width:46px}}

.fld input:disabled{background:#f0f3f6;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:5px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:12px;box-shadow:none}
.modal{position:fixed;inset:0;background:rgba(7,19,33,.55);backdrop-filter:blur(3px);display:none;place-items:center;z-index:80;padding:20px}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:20px;width:100%;max-width:560px;padding:30px;box-shadow:0 30px 80px rgba(7,19,33,.4);max-height:90vh;overflow:auto}
.mbox h3{font-size:20px;letter-spacing:-.6px;margin-bottom:4px}.mbox .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.mbox .acts{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.toast{position:fixed;bottom:26px;right:26px;background:var(--navy);color:#fff;padding:14px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 18px 40px rgba(7,19,33,.3);transform:translateY(90px);opacity:0;transition:.3s;z-index:99;border-left:4px solid var(--red)}
.toast.show{transform:none;opacity:1}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}.burger{display:block}
 .side{position:fixed;left:0;top:68px;z-index:40;width:280px;transform:translateX(-100%);transition:.3s;box-shadow:0 20px 50px rgba(7,19,33,.25)}
 .side.open{transform:none}.search,.user div,.campus{display:none}.main{padding:22px 18px 40px}.hero{padding:26px 22px}.hero h1{font-size:27px}
}
@media(max-width:560px){.kpis{grid-template-columns:1fr}.top{padding:0 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<!-- ============ HEADER (with logo) ============ -->
<header class="top">

         onerror="this.onerror=null;this.src='https://ath.org.pk/wp-content/uploads/2025/06/Easa-logo-red-and-white.png'">
  </a>
  <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
    <input id="gsearch" type="text" placeholder="Search students, ID or CNIC..." autocomplete="off"></div>

      <a href="login.html" class="icon-btn" style="display:grid;place-items:center" aria-label="Sign out" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></a></div>

<div class="layout">

      <a href="mailto:info@ath.org.pk"><i class="fa-regular fa-envelope"></i>info@ath.org.pk</a></div>

  </aside>
  <main class="main" id="view"></main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================
   DATA  (SAMPLE VALUES: replace with your API later)
===================================================== */
const MODS=[
 {id:'dashboard',i:'fa-gauge-high',n:'Dashboard',d:'Your day at a glance: admissions, fees and deadlines.'},
 {id:'enquiries',i:'fa-headset',n:'Enquiries',d:'Track leads from counselling forms and convert them to students.',b:'12',
  f:[['Lead list','Every enquiry with phone, city and status.'],['Source tracking','See which leads came from Google, Facebook or referrals.'],['Follow-ups','Reminders and call notes per counsellor.'],['Convert to student','Turn a lead into a registration in one click.']]},
 {id:'students',i:'fa-user-graduate',n:'Student Registration',d:'Registered students and the Add Student form.'},
 {id:'programs',i:'fa-book-open',n:'Programs and Modules',d:'EASA modules M1 to M17, HND units and other programs.',
  f:[['School of Aviation','Aircraft Maintenance Engineering: 6 semesters, modules M1 to M17 by year.'],['School of Computing','Pearson HND Digital Technologies: 4 semesters, three pathways.'],['Awarding bodies','EASA, Pearson and NCC Education.'],['Fee structure','Admission, semester, exam and OJT fees per program.']]},
 {id:'batches',i:'fa-calendar-days',n:'Batches, Timetable and Attendance',d:'Batches, class schedules and daily attendance.',
  f:[['Batches','Create intakes (Fall or Winter) per campus and program.'],['Timetable','Weekly class schedule by batch, room and faculty.'],['Attendance','Mark and review attendance with shortage alerts.'],['Faculty allocation','Assign teachers to modules and batches.']]},
 {id:'fees',i:'fa-wallet',n:'Fees and Accounts',d:'Vouchers, payments, installments and defaulters.',b:'8 due',
  f:[['Fee vouchers','Generate admission and semester vouchers.'],['Payments','Record cash, bank and online payments with receipts.'],['Installments','Payment plans and due-date tracking.'],['Defaulters','Overdue list with reminders. Supports PKR, EUR and GBP.']]},
 {id:'exams',i:'fa-file-signature',n:'Exams, Results and Transcripts',d:'Exam sessions, module enrolment, results and transcripts.',
  f:[['Exam sessions','Dates and last registration date for each session.'],['Module enrolment','Register students for EASA modules.'],['Results entry','Marks, attempts and pass or fail status.'],['Transcripts','Print official transcripts with the ATH logo.']]},
 {id:'assignments',i:'fa-pen-ruler',n:'Assignments',d:'HND assignments, deadlines, grades and feedback.',
  f:[['Assignment briefs','Units, deadlines and submission rules.'],['Submissions','Track who has submitted and who is late.'],['Grading','Pass, merit or distinction with feedback.'],['Resubmissions','Manage second attempts.']]},
 {id:'ojt',i:'fa-briefcase',n:'OJT',d:'On-the-job training partners, placements and hours.',

 {id:'documents',i:'fa-folder-open',n:'Documents',d:'Certificates, fee challans, letters and student files.',
  f:[['Letters','Enrolment, experience and bonafide letters.'],['Certificates','Course completion certificates.'],['Fee challans','Printable vouchers and statements.'],['Student files','CNIC, transcripts and uploaded documents.']]},
 {id:'reports',i:'fa-chart-pie',n:'Reports',d:'Admissions, fees and results, by campus and program.',
  f:[['Admissions report','By source, campus, school and month.'],['Fee report','Collection, outstanding and defaulters.'],['Exam report','Pass rates per module.'],['Export','Download as PDF or Excel.']]},

];
const KPI={
 all:{stu:482,enq:37,fee:'12.4M',due:'1.8M',bars:[38,52,44,61,73,58]}};
const MONTHS=['Apr','May','Jun','Jul','Aug','Sep'];
const STU=[
 ['Ayesha Khan','ATH-26-0148','AME (EASA)','main','Enrolled','Paid'],

 ['Sara Ahmed','ATH-26-0146','HND Data Science','main','Documents verified','Pending'],
 ['Bilal Hussain','ATH-26-0145','AME (EASA)','main','Enrolled','Paid'],
 ['Zainab Malik','ATH-26-0144','HND Artificial Intelligence','main','Draft','Pending'],
 ['Usman Raza','ATH-25-0139','AME (EASA)','main','Enrolled','Partial'],
 ['Hina Tariq','ATH-25-0131','HND Cyber Security','main','Enrolled','Paid'],
 ['Farhan Saeed','ATH-25-0127','AME (EASA)','main','Fee paid','Paid']];

const SC={'Enrolled':'c-green','Fee paid':'c-blue','Documents verified':'c-amber','Draft':'c-grey'};
const FC={'Paid':'c-green','Partial':'c-amber','Pending':'c-red'};

let campus='all',query='';

/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)};
const rows=()=>STU.filter(s=>(campus==='all'||s[3]===campus)&&(!query||(s[0]+s[1]+s[2]).toLowerCase().includes(query.toLowerCase())));
const tableHtml=list=>list.length?`<div class="tbl"><table><thead><tr><th>Student</th><th>Program</th><th>Status</th><th>Fees</th></tr></thead><tbody>${
 list.map((s,i)=>`<tr onclick="viewStu('${s[1]}')"><td><div class="who"><div class="avatar" style="background:${COL[i%5]}">${ini(s[0])}</div><div>${s[0]}<small>${s[1]}</small></div></div></td><td>${s[2]}</td><td><span class="chip ${SC[s[4]]}">${s[4]}</span></td><td><span class="chip ${FC[s[5]]}">${s[5]}</span></td></tr>`).join('')
 }</tbody></table></div>`:'<div class="empty"><i class="fa-regular fa-face-frown"></i><br>No students match your search.</div>';

/* ===== views ===== */
function vDashboard(){
 const k=KPI[campus],max=Math.max(...k.bars),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 return `
 <section class="hero"><div class="eyebrow" style="color:#b9c6d3">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
  <h1>${g}, <span>Admin</span></h1>
  <p>Manage admissions, fees, exams and training from one place.</p>
  <div class="acts"><a class="btn" href="#students/new"><i class="fa-solid fa-user-plus"></i>Add Student</a>
   <a class="btn ghost" href="#enquiries"><i class="fa-solid fa-headset"></i>New Enquiry</a>
   <a class="btn ghost" href="#fees"><i class="fa-solid fa-wallet"></i>Record Payment</a></div></section>

 <div class="kpis">
  <div class="kpi"><em class="up">+8.2%</em><div class="ic" style="background:#fdebec;color:var(--red)"><i class="fa-solid fa-user-graduate"></i></div><b>${k.stu}</b><span>Active students</span></div>
  <div class="kpi"><em class="up">+12</em><div class="ic" style="background:#e6f1fb;color:var(--blue)"><i class="fa-solid fa-headset"></i></div><b>${k.enq}</b><span>New enquiries this month</span></div>
  <div class="kpi"><em class="up">+5.4%</em><div class="ic" style="background:#e7f6ee;color:var(--green)"><i class="fa-solid fa-wallet"></i></div><b>${k.fee}</b><span>Fees collected (PKR)</span></div>
  <div class="kpi"><em class="down">Action</em><div class="ic" style="background:#fff4dd;color:var(--amber)"><i class="fa-solid fa-triangle-exclamation"></i></div><b>${k.due}</b><span>Overdue fees (PKR)</span></div>
 </div>

 <div class="grid2">
  <div class="card"><h3>Admissions</h3><p class="sub">New registrations per month</p>
   <div class="bars">${k.bars.map((v,i)=>`<div class="bar"><i data-v="${v}" style="height:${v/max*82}%"></i><small>${MONTHS[i]}</small></div>`).join('')}</div></div>
  <div class="card"><h3>Students by school</h3><p class="sub">Share of active students</p>
   <div class="donut"><div class="ring"><div>${k.stu}<small>students</small></div></div>
   <div class="legend"><p><s></s>Aviation<span>58%</span></p><p><s></s>Computing<span>42%</span></p></div></div></div>
 </div>

 <div class="sec-h"><div><h2>Modules</h2><p>Everything you manage at ATH</p></div></div>
 <div class="mods">${MODS.filter(m=>m.id!=='dashboard').map(m=>`<a class="mod" href="#${m.id}">${m.b?`<span class="chip c-red badge">${m.b}</span>`:''}<div class="mi"><i class="fa-solid ${m.i}"></i></div><h4>${m.n}</h4><p>${m.d}</p></a>`).join('')}</div>

 <div class="grid2" style="margin-top:30px">
  <div class="card"><h3>Recent registrations</h3><p class="sub">Latest students added by your team</p>${tableHtml(rows().slice(0,5))}</div>
  <div class="card"><h3>Fee quick reference</h3><p class="sub">Current fee structure </p>
   <div class="fee-h">Aircraft Maintenance Engineering</div>
   <div class="fee"><span>Admission (non-refundable)</span><b>PKR 150,000</b></div>
   <div class="fee"><span>Semester (6 semesters)</span><b>PKR 140,000</b></div>
   <div class="fee"><span>International EASA exam</span><b>&euro; 139</b></div>

function vStudents(){
 return `<div class="page-h"><div><div class="eyebrow">Admissions</div><h1>Student Registration</h1><p>${rows().length} registered ${rows().length===1?'student':'students'}. Click Add Student to register a new one.</p></div>
  <a class="btn" href="#students/new"><i class="fa-solid fa-user-plus"></i>Add Student</a></div>
 <div class="card"><div class="tools">
  <div class="f"><i class="fa-solid fa-magnifying-glass"></i><input class="inp" id="q" placeholder="Search by name, ID or program" value="${query}"></div>
  <select class="sel" id="fs"><option value="">All schools</option><option>AME</option><option>HND</option></select>
  <select class="sel" id="fst"><option value="">All statuses</option>${Object.keys(SC).map(s=>`<option>${s}</option>`).join('')}</select></div>

function vModule(m){
 return `<div class="page-h"><div><div class="eyebrow">Module</div><h1>${m.n}</h1><p>${m.d}</p></div></div>
 <div class="feats">${m.f.map(f=>`<div class="feat"><i class="fa-solid ${m.i}"></i><h4>${f[0]}</h4><p>${f[1]}</p></div>`).join('')}</div>
 <div class="note"><i class="fa-solid fa-circle-info"></i>This module's screens are the next to be built. The menu and layout are ready.</div>`;
}

/* =====================================================
   STUDENT REGISTRATION FORM
===================================================== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nextNo=()=>Math.max(...STU.map(s=>+s[1].split('-')[2]))+1;

const QUAL=['Matric / O-Levels','FSc / Intermediate','A-Levels','Level 3','Diploma (DAE)',"Bachelor's degree",'Other'];
const PR={Aviation:['Aircraft Maintenance Engineering (EASA Part-66)'],Computing:['HND Digital Technologies (Pearson)','Computing Level 4/5 (NCC Education)']};
const F=(l,n,t='text',o={})=>`<div class="fld ${o.w||''}" ${o.id?`id="${o.id}"`:''}><label>${l}${o.r?' <b>*</b>':''}</label>${

   <label class="chk full"><input type="checkbox" id="same"> Permanent address is the same as current address</label></div>

   ${F('HND Pathway','pathway','select',{r:1,id:'pw',w:'full',o:['Cyber Security','Artificial Intelligence','Data Science & Analytics']})}</div>
  <div id="av" class="hid"><div class="sub-h">Aviation-specific details</div>

  <div class="fg">${F('Highest Qualification','qual','select',{r:1,o:QUAL})}${F('Institution Name','inst','text',{r:1})}
   ${F('Year of Passing','year','number',{r:1,p:'2024'})}${F('Certificates Attached','certs','select',{r:1,o:['Yes','No, to follow']})}
   ${F('Marks Obtained','marks','number',{r:1})}${F('Total Marks','total','number',{r:1})}
   ${F('Percentage','pct','text',{ro:1,p:'Calculated automatically'})}${F('Grade (if given)','grade')}
   ${F('Years of Work Experience','exp','number',{id:'xw',w:'full',h:'Needed when the student does not hold FSc, A-Levels or Level 3'})}</div>

   <div class="vch"><div class="vt"><span>Admission Fee Voucher</span><i class="fa-solid fa-plane"></i></div><small>Voucher no.</small><b>VCH-${id.slice(4)}</b>
    <div class="vr"><span>Student</span><em id="vn">-</em></div><div class="vr"><span>Program</span><em id="vp">-</em></div>
    <div class="vr"><span>Admission fee</span><em>PKR 150,000</em></div><div class="vr"><span>Discount</span><em id="vd">PKR 0</em></div>

function initForm(){
 const f=$('#sf'),N=ST.length,sid=newId();
 let s=0;
 const pw=()=>$('#pw').classList.toggle('hid',!/Pearson/.test(f.program.value));
 const sch=()=>{const v=f.school.value,l=PR[v]||[];
  f.program.innerHTML='<option value="">Select</option>'+l.map(x=>`<option>${x}</option>`).join('');
  if(l.length===1)f.program.value=l[0];
  $('#av').classList.toggle('hid',v!=='Aviation');
  document.querySelectorAll('.av-only').forEach(e=>e.classList.toggle('hid',v!=='Aviation'));pw();elig()};

 const elig=()=>{const q=f.qual.value,m=+f.marks.value,t=+f.total.value,pc=t?Math.round(m/t*1000)/10:0,ex=+f.exp.value||0,sc=f.school.value,e=$('#el');
  f.pct.value=t&&m?pc+'%':'';
  $('#xw').classList.toggle('hid',!(sc==='Computing'&&q&&!/FSc|A-Levels|Level 3|Bachelor/.test(q)));
  let c='am',ic='fa-circle-question',h='Waiting for details',p='Choose the school and highest qualification to see the eligibility result.';
  if(sc==='Aviation'){ic='fa-circle-info';h='Manual review';p='Entry criteria for the Aviation program are not published on the ATH website, so admissions will confirm eligibility.'}
  else if(sc==='Computing'&&q){
   if(/A-Levels|Level 3|Bachelor/.test(q)){c='ok';ic='fa-circle-check';h='Eligible';p=q+' meets the HND entry requirement.'}
   else if(/FSc/.test(q)){
    if(!t||!m){h='Enter marks';p='Add marks obtained and total marks to confirm the FSc result.'}
    else if(pc>=60){c='ok';ic='fa-circle-check';h='Eligible';p='FSc / Intermediate with '+pc+'% (60% or above).'}
    else{h='Needs review';p='The intermediate result is '+pc+'%, below 60%. Admissions must review this application.'}}
   else if(ex>=3){c='ok';ic='fa-circle-check';h='Eligible on work experience';p=ex+' years of verifiable work experience with '+q+'.'}
   else{c='no';ic='fa-circle-xmark';h='Not eligible yet';p='The HND needs FSc, A-Levels or Level 3, or 3 years of verifiable work experience.'}}
  e.className='elig '+c;e.innerHTML=`<i class="fa-solid ${ic}"></i><div><b>${h}</b>${p}</div>`;f.dataset.e=c};

 const fee=()=>{const d=+f.disc.value||0,p=Math.max(150000-d,0);
  f.pay.value=p.toLocaleString('en-US');$('#vpay').textContent='PKR '+p.toLocaleString('en-US');$('#vd').textContent='PKR '+d.toLocaleString('en-US');
  $('#vn').textContent=f.sname.value||'-';$('#vp').textContent=f.program.value||'-'};

 const summ=()=>{const pth=$('#pw').classList.contains('hid')?'':' / '+f.pathway.value;
  const r=[['Name',f.sname.value],['CNIC / B-Form',f.cnic.value],['Mobile',f.mobile.value],['Campus',f.campus.value],['School',f.school.value],
   ['Program',f.program.value+pth],['Qualification',f.qual.value+(f.pct.value?' ('+f.pct.value+')':'')],['Eligibility',$('#el b').textContent],
   ['Fee payable','PKR '+f.pay.value],['Received now','PKR '+(+f.recv.value||0).toLocaleString('en-US')],['Documents',$('#dc').textContent]];
  $('#sum').innerHTML=r.map(x=>`<div><span>${x[0]}</span><b>${esc(x[1]||'-')}</b></div>`).join('')};

 const go=n=>{s=n;
  document.querySelectorAll('.st').forEach((e,i)=>e.classList.toggle('on',i===n));
  document.querySelectorAll('.stp').forEach((e,i)=>{e.classList.toggle('on',i===n);e.classList.toggle('dn',i<n)});
  $('#bk').style.visibility=n?'visible':'hidden';
  $('#nx').innerHTML=n===N-1?'Register Student <i class="fa-solid fa-check"></i>':'Continue <i class="fa-solid fa-arrow-right"></i>';
  $('#stx').textContent='Step '+(n+1)+' of '+N;
  if(n===5)fee();if(n===N-1)summ();scrollTo({top:0,behavior:'smooth'})};

 const valid=n=>{let bad=null;
  document.querySelectorAll(`.st[data-s="${n}"] [required]`).forEach(e=>{
   if(e.offsetParent===null)return;
   const v=e.type==='checkbox'?(e.checked?'1':''):e.value.trim();let g=!!v;
   if(g&&/cnic$/i.test(e.name))g=v.replace(/\D/g,'').length===13;
   if(g&&/^(mobile|emg|nokph|gmob)$/.test(e.name))g=v.replace(/\D/g,'').length>=10;
   if(g&&e.type==='email')g=e.checkValidity();
   e.closest('.fld').classList.toggle('bad',!g);if(!g&&!bad)bad=e});
  if(bad){bad.focus();toast('Please complete the highlighted fields')}return !bad};

 const reg=()=>{
  const due=Math.max(150000-(+f.disc.value||0),0),paid=+f.recv.value||0,e=f.dataset.e;
  const fs=paid>=due?'Paid':paid>0?'Partial':'Pending',st=e==='ok'?(paid>=due?'Enrolled':paid>0?'Fee paid':'Documents verified'):'Draft';
  const prog=f.school.value==='Aviation'?'AME (EASA)':/Pearson/.test(f.program.value)?'HND '+f.pathway.value.split(' &')[0]:'NCC Computing';
  STU.unshift([esc(f.sname.value.trim()),sid,prog,'main',st,fs,{cnic:esc(f.cnic.value),mobile:esc(f.mobile.value),email:esc(f.email.value),g:esc(f.gname.value)}]);
  $('#view').innerHTML=`<div class="card ok-card"><div class="okc"><i class="fa-solid fa-check"></i></div><h2>Student registered</h2>

  toast('Student registered: '+sid);scrollTo(0,0)};

 f.onsubmit=e=>e.preventDefault();
 $('#nx').onclick=()=>{if(!valid(s))return;s===N-1?reg():go(s+1)};

 f.addEventListener('input',e=>{const t=e.target,fl=t.closest('.fld');if(fl)fl.classList.remove('bad');
  if(/cnic$/i.test(t.name)){const d=t.value.replace(/\D/g,'').slice(0,13);t.value=d.length>12?d.slice(0,5)+'-'+d.slice(5,12)+'-'+d.slice(12):d.length>5?d.slice(0,5)+'-'+d.slice(5):d}
  if(['qual','marks','total','exp'].includes(t.name))elig();
  if(['disc','sname','program'].includes(t.name))fee();
  if(t.name==='addr'&&$('#same').checked)f.paddr.value=t.value;
  if(t.name==='dob')$('#age').textContent=t.value?'Age: '+Math.floor((Date.now()-new Date(t.value))/31557600000)+' years':''});
 f.addEventListener('change',e=>{const t=e.target;
  if(t.name==='school')sch();if(t.name==='program')pw();
  if(t.name==='medst'){f.medex.disabled=!/Class/.test(t.value);if(f.medex.disabled)f.medex.value=''}

  else if(t.type==='file'){const l=t.closest('.up');l.classList.toggle('done',!!t.files.length);l.querySelector('span').textContent=t.files.length?t.files[0].name:'Click to upload';
   $('#dc').textContent=document.querySelectorAll('.up.done').length+' uploaded'}});
 f.medex.disabled=true;sch();go(0);
}

 const [id,sub]=route.split('/'),m=MODS.find(x=>x.id===id)||MODS[0],nw=m.id==='students'&&sub==='new';
 $('#nav').innerHTML=GR.map(g=>`<h6>${g[0]}</h6>`+g[1].map(i=>{const x=MODS.find(y=>y.id===i);
  return `<a href="#${x.id}" class="${x.id===m.id?'on':''}"><i class="fa-solid ${x.i}"></i>${SN[x.id]||x.n}${x.b?`<span class="badge">${x.b}</span>`:''}</a>`}).join('')).join('');
 $('#view').innerHTML=nw?vForm():m.id==='dashboard'?vDashboard():m.id==='students'?vStudents():vMod(m);
 $('#side').classList.remove('open');document.title='ATH | '+(nw?'New Student':m.n);scrollTo(0,0);
 if(nw)initForm();
 else if(m.id==='students'){
  const t=()=>{const a=$('#fs').value,b=$('#fst').value;$('#tb').innerHTML=tableHtml(rows().filter(s=>(!a||s[2].startsWith(a))&&(!b||s[4]===b)))};
  $('#q').oninput=e=>{query=e.target.value;$('#gsearch').value=query;t()};$('#fs').onchange=t;$('#fst').onchange=t;
 }else if(m.id!=='dashboard')initMod(m);
 }catch(err){console.error(err);$('#view').innerHTML=`<div class="card"><h3>Something went wrong</h3><p class="sub">${esc(err.message)}</p></div>`}
}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();nav(a.getAttribute('href').slice(1))}});
addEventListener('hashchange',()=>{if(cur()!==route){route=cur();render()}});
$('#gsearch').oninput=e=>{query=e.target.value;route!=='students'?nav('students'):render();$('#gsearch').focus()};
$('#burger').onclick=()=>$('#side').classList.toggle('open');
render();
</script>
</body>
</html>
